name: Checks and portable builds
on:
  push:
    branches: [main, 'sjarrett/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            runtime: win-x64
          - os: ubuntu-latest
            runtime: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Core and UI smoke checks
        shell: pwsh
        run: |
          dotnet test tests/Wyrmwatch.Core.Tests -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet test tests/Wyrmwatch.Desktop.Tests -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build portable app
        shell: pwsh
        run: ./scripts/build.ps1 -Runtime ${{ matrix.runtime }} -SkipTests
      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y desktop-file-utils
      - name: Package downloads and installer
        run: |
          python scripts/package.py ${{ matrix.runtime }}
          python scripts/package-installers.py ${{ matrix.runtime }}
      - name: Verify Windows installer lifecycle
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-windows-installer.ps1 -Installer (Get-ChildItem dist/*-setup.exe).FullName
      - name: Verify low-privilege Windows service
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          dotnet publish tests/FixtureServer -c Release -r win-x64 --self-contained true -o dist/service-fixture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/test-windows-service.ps1 -ApplicationDirectory dist/win-x64 -FixtureDirectory dist/service-fixture
      - uses: actions/upload-artifact@v4
        with:
          name: Wyrmwatch-${{ matrix.runtime }}
          path: dist/${{ matrix.runtime }}/
      - uses: actions/upload-artifact@v4
        with:
          name: downloads-${{ matrix.runtime }}
          path: |
            dist/Wyrmwatch-*.zip
            dist/Wyrmwatch-*.tar.gz
            dist/Wyrmwatch-*.exe
            dist/Wyrmwatch-*.deb
            dist/Wyrmwatch-*.sha256
          if-no-files-found: error

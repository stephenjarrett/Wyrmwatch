name: MVP checks and builds
on:
  push:
    branches: [main, 'sjarrett/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            runtime: win-x64
          - os: ubuntu-latest
            runtime: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Core and UI smoke checks
        shell: pwsh
        run: |
          dotnet test tests/Dragonwilds.Core.Tests -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet test tests/Wyrmwatch.Desktop.Tests -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build portable app
        shell: pwsh
        run: ./scripts/build.ps1 -Runtime ${{ matrix.runtime }} -SkipTests
      - uses: actions/upload-artifact@v4
        with:
          name: Wyrmwatch-${{ matrix.runtime }}
          path: dist/${{ matrix.runtime }}/

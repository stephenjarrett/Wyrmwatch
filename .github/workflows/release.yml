name: Release portable builds
run-name: ${{ github.event_name == 'workflow_dispatch' && format('Package {0} at {1}', inputs.approved_tag, inputs.source_sha) || github.ref_name }}
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      approved_tag:
        description: 'Immutable version tag prepared by trusted master orchestration'
        required: true
        type: string
      source_sha:
        description: 'Exact immutable source commit; must match the checked-out tag'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: wyrmwatch-package-${{ inputs.approved_tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  package:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/master'
    strategy:
      matrix:
        include:
          - os: windows-latest
            runtime: win-x64
          - os: ubuntu-latest
            runtime: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.approved_tag) || github.ref }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Release policy and fault checks (offline)
        run: |
          python -m pip install --disable-pip-version-check -r tests/release/requirements.txt
          python -m unittest discover -s tests/release -v
      - name: Validate release version
        shell: pwsh
        env:
          APPROVED_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.approved_tag || github.ref_name }}
          APPROVED_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.source_sha || github.sha }}
        run: |
          [xml]$props = Get-Content Directory.Build.props
          $versions = $props.SelectNodes('/Project/PropertyGroup/Version')
          if ($versions.Count -ne 1 -or $versions[0].InnerText -cnotmatch '^[0-9]+\.[0-9]+\.[0-9]+$') { throw 'Exactly one numeric project version is required' }
          if ($env:APPROVED_TAG -cne "v$($versions[0].InnerText)") { throw 'Tag must match the project version' }
          if ($env:APPROVED_SHA -cnotmatch '^[0-9a-f]{40}$' -or (git rev-parse HEAD) -cne $env:APPROVED_SHA) { throw 'Tag checkout must match the exact approved source commit' }
      - name: Test and build
        shell: pwsh
        run: ./scripts/build.ps1 -Runtime ${{ matrix.runtime }}
      - name: Verify packaged shared runtime
        shell: pwsh
        run: ./scripts/test-published.ps1 -ApplicationDirectory dist/${{ matrix.runtime }}
      - name: Package with source and notices
        run: python scripts/package.py ${{ matrix.runtime }}
      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y desktop-file-utils
      - name: Build installer
        run: python scripts/package-installers.py ${{ matrix.runtime }}
      - name: Verify Windows installer lifecycle
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-windows-installer.ps1 -Installer (Get-ChildItem dist/*-setup.exe).FullName
      - name: Verify low-privilege Windows service
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          dotnet publish tests/FixtureServer -c Release -r win-x64 --self-contained true -o dist/service-fixture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/test-windows-service.ps1 -ApplicationDirectory dist/win-x64 -FixtureDirectory dist/service-fixture
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.runtime }}
          path: |
            dist/Wyrmwatch-*.zip
            dist/Wyrmwatch-*.tar.gz
            dist/Wyrmwatch-*.exe
            dist/Wyrmwatch-*.deb
            dist/Wyrmwatch-*.sha256
          if-no-files-found: error

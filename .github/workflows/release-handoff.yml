name: Prepare and publish approved releases
on:
  workflow_run:
    # Legacy user-pushed tags only. Bot verification uses explicit dispatch callbacks.
    workflows: [Release portable builds]
    types: [completed]
  workflow_dispatch:
    inputs:
      completed_run_id:
        description: 'Internal verification callback; leave empty for manual recovery'
        required: false
        default: ''
        type: string
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: read
  actions: read
concurrency:
  group: wyrmwatch-release
  cancel-in-progress: false
jobs:
  handoff:
    if: >-
      ((github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && github.ref == 'refs/heads/master') ||
      (github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.path == '.github/workflows/release.yml' &&
       startsWith(github.event.workflow_run.head_branch, 'v') &&
       (github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          persist-credentials: false
      - name: Discover verified source runs and complete approved publication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMPLETED_RUN_ID: ${{ inputs.completed_run_id || '' }}
        run: python scripts/release-handoff.py
